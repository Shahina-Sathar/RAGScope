[project]
name = "ragscope-frontend"
version = "0.1.0"
description = "RAGScope Dashboard Frontend"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
